services:
  athena:
    build: .
    container_name: athena
    restart: unless-stopped
    ports:
      # The address to publish on: this machine's home-network address, so phones and TVs at home can reach it.
      # Never 0.0.0.0 on a machine that faces the internet.
      - "${ATHENA_BIND:-127.0.0.1}:${ATHENA_PORT:-8800}:8800"
    volumes:
      # Settings (API keys, mode 600) and the request log. Given to 99:100 at start; Athena runs as that user.
      - ./data:/data
    environment:
      TZ: ${TZ:-America/New_York}
      # All optional: set them in the browser instead. When set here, they win and the browser shows them locked.
      PLEX_URL: ${PLEX_URL:-}
      ATHENA_PROVIDER: ${ATHENA_PROVIDER:-}
      ATHENA_MODEL: ${ATHENA_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8800]/"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/inceptyon-labs/athena/main/unraid-icon.png"
